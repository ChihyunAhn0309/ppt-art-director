name: Validate helpers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run helper tests
        run: python -m unittest discover -s tests -v
      - name: Check palette roles
        run: python scripts/palette_check.py assets/palettes.json
      - name: Parse PowerShell helper
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/apply_motion.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }
